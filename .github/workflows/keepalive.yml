name: Daily Keepalive

on:
  schedule:
    - cron: '30 12 * * *'  # runs at 12:30 UTC daily
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update keepalive file
        run: |
          echo "Last updated: $(date -u)" > .keepalive
          git add .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "keepalive"
          git push   
          